<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业知识库 · LangGraph RAG</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 20px; }
  #box { border: 1px solid #e1e4e8; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; background: #fafbfc; }
  .u { text-align: right; margin: 8px 0; }
  .u span { background: #dbeafe; padding: 6px 10px; border-radius: 12px; display: inline-block; }
  .a { text-align: left; margin: 8px 0; }
  .a span { background: #fff; border: 1px solid #e1e4e8; padding: 6px 10px; border-radius: 12px; display: inline-block; white-space: pre-wrap; }
  .s { font-size: 12px; color: #57606a; margin: 4px 0 12px 2px; }
  .s pre { white-space: pre-wrap; background: #f3f4f6; padding: 8px; border-radius: 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  #q { flex: 1; padding: 10px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 14px; }
  button { padding: 10px 18px; border: none; background: #2563eb; color: #fff; border-radius: 8px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <h1>企业知识库问答 · LangGraph + HybridRAG</h1>
  <div id="box"></div>
  <div class="row">
    <input id="q" placeholder="问点什么，比如：员工请假怎么请？年假有几天？" />
    <button id="send">发送</button>
  </div>
<script>
  const box = document.getElementById('box');
  const q = document.getElementById('q');

  async function send() {
    const text = q.value.trim();
    if (!text) return;
    q.value = '';
    box.innerHTML += `<div class="u"><span>${text.replace(/</g,'&lt;')}</span></div>`;
    box.scrollTop = box.scrollHeight;
    try {
      const r = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text })
      });
      const d = await r.json();
      let html = `<div class="a"><span>${String(d.answer).replace(/</g,'&lt;')}</span></div>`;
      if (d.sources && d.sources.length) {
        html += `<div class="s"><b>来源</b><pre>${d.sources.join('\\n\\n').replace(/</g,'&lt;')}</pre></div>`;
      }
      box.innerHTML += html;
      box.scrollTop = box.scrollHeight;
    } catch (e) {
      box.innerHTML += `<div class="a"><span>请求失败：${e}</span></div>`;
    }
  }

  document.getElementById('send').onclick = send;
  q.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
