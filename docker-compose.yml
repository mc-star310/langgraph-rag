services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 首次启动后拉取嵌入模型：
    #   docker exec -it langgraph-rag-ollama-1 ollama pull bge-m3

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - EMBED_MODEL=bge-m3
    depends_on:
      - ollama

volumes:
  ollama_data:
